<header class="site-header" [class.scrolled]="scrolled()">
  <div class="header-inner container">
    <a class="brand-logo" [routerLink]="homeRoute()" [attr.aria-label]="labels().home">
      <img src="/assets/images/brand/safe-travel-logo.webp" alt="" width="420" height="420" />
    </a>
    <button
      id="menu-toggle"
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      (click)="toggle()"
    >
      <span>{{ menuOpen() ? labels().close : labels().menu }}</span>
      <span class="hamburger" [class.open]="menuOpen()" aria-hidden="true"></span>
    </button>
    <nav
      id="primary-navigation"
      [attr.aria-label]="labels().navigation"
      [class.is-open]="menuOpen()"
    >
      @for (item of items(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          (click)="close()"
          >{{ item.label }}</a
        >
      }
    </nav>
    <div class="header-actions">
      <div class="language-switch" aria-label="Language">
        <a
          [routerLink]="englishRoute()"
          [attr.aria-current]="language.current() === 'en' ? 'page' : null"
          hreflang="en"
          lang="en"
          >EN</a
        >
        <span aria-hidden="true">/</span>
        <a
          [routerLink]="spanishRoute()"
          [attr.aria-current]="language.current() === 'es' ? 'page' : null"
          hreflang="es"
          lang="es"
          >ES</a
        >
      </div>
      <a class="button header-cta" [routerLink]="contactRoute()"
        >{{ labels().contact }} <span aria-hidden="true">↗</span></a
      >
    </div>
  </div>
</header>
